see subtotal, estimated shipping, or total before deciding to proceed`,`No trust signals at the checkout stage — no secure payment badge, no free returns notice, no quality guarantee to address last-moment hesitation`,`No cross-sell or 'You might also like' section — a significant cart abandonment reduction opportunity is missed for a small 7-product range`],recommended:{intro:`Restructure the cart page to make the checkout action and order summary immediately visible, and remove the layout elements that delay conversion.`,items:[`Move 'Proceed to Checkout' CTA and order summary (subtotal + estimated shipping + total) to a sticky right-column panel visible without scrolling`,`Collapse 'Add order notes' into a small expandable link — 'Add a note to your order' — below the cart items rather than a full-height text area above the checkout button`,`Add a trust strip adjacent to the checkout CTA — 'Secure checkout · Free UK delivery over £150 · Clinically formulated' — reduces last-moment hesitation at the highest-value point in the purchase funnel`,`Add a compact 'You might also like' product strip below the cart — with 7 products, showing 2–3 complementary items reduces abandonment for users who leave without purchasing`]}},mobile:{working:[`Product name and price are legible on mobile`,`Quantity controls function well on touch`],notWorking:[`Full-width product image consumes most of the mobile viewport — the cart image is unnecessarily large for a confirmation-stage page where users are not still evaluating the product`,`Checkout CTA and order total require extensive scrolling on mobile — below the large image, order notes textarea, and coupon field`,`'Add order notes' textarea is the most prominent element on the mobile cart — a rarely-used feature dominates the most conversion-critical page on the site`,`No trust signals or reassurance visible on mobile cart — users completing high-value purchases on mobile need payment security confirmation`],recommended:{intro:`Optimise mobile cart for fast checkout completion — reduce friction between cart arrival and the checkout tap.`,items:[`Reduce product image to a compact thumbnail on mobile — at the cart stage users have already decided to buy, the large image adds scroll without value`,`Sticky 'Proceed to Checkout' bar at the bottom of the mobile viewport showing order total — always visible regardless of scroll position`,`Collapse 'Add order notes' to a small expandable link below the cart item`,`Add a single trust line above the checkout button — 'Secure checkout · Free UK delivery over £150'`]}},research:{intro:`Four pieces of published UX research supporting the cart page recommendations.`,findings:[{source:`Baymard`,org:`Baymard Institute`,label:`Cart & Checkout UX — Order Summary Visibility`,detail:`Baymard's checkout usability research found that users expect to see a clear order summary — items, subtotal, shipping, and total — before committing to checkout. When this information requires scrolling to find, users either abandon to re-check prices elsewhere or proceed with uncertainty, increasing checkout abandonment. The order summary and CTA must be visible on cart page load.`,url:`https://baymard.com/blog/cart-page-ux`},{source:`Baymard`,org:`Baymard Institute`,label:`Cart Abandonment — Trust Signals at Checkout`,detail:`Baymard identifies lack of trust signals as one of the top reasons users abandon at the cart and checkout stage. For premium products above £80, a secure payment badge and a clear returns policy adjacent to the checkout CTA directly address the two most common last-moment hesitation triggers: 'is this payment secure?' and 'what if I change my mind?'`,url:`https://baymard.com/blog/cart-abandonment-rate`},{source:`NN/G`,org:`Nielsen Norman Group`,label:`Scrolling and Attention — CTA Visibility`,detail:`57% of viewing time is concentrated above the fold. A cart page where the primary conversion action — Proceed to Checkout — is below the fold means the majority of users arrive on the most conversion-critical page and cannot see the action they need to take without scrolling. This is a direct and measurable conversion barrier.`,url:`https://www.nngroup.com/articles/scrolling-and-attention/`},{source:`Baymard`,org:`Baymard Institute`,label:`Mobile Checkout UX — Sticky CTA Patterns`,detail:`Baymard's mobile checkout research found that a persistent sticky 'Proceed to Checkout' bar showing the order total significantly reduces mobile cart abandonment. Mobile users complete checkout journeys in shorter, more distracted sessions — a sticky CTA ensures the conversion action is always one tap away regardless of scroll depth.`,url:`https://baymard.com/blog/mobile-checkout-ux`}]},competitors:[{name:`Aesop`,device:`Desktop`,pros:[`Cart page maintains the minimal premium aesthetic of the rest of the site — the purchase completion environment is consistent with the brand rather than switching to a generic checkout template`,`Order summary is clean and uncluttered with no upsell or cross-sell units — respects the user's commitment to purchase and removes distraction at the point of highest intent`,`Delivery and returns information is summarised inline in the cart — answers the two highest-frequency pre-checkout questions without requiring navigation away from the cart`],cons:[`No discount code field in the cart — users who have a promotional code cannot easily apply it, potentially causing abandonment in favour of a competitor`,`Limited delivery option selection in the cart — users must proceed to checkout before seeing the full range of delivery speeds and costs`,`Cart does not surface the loyalty programme points impact of the purchase — a missed opportunity to reinforce the value of completing the transaction`],context:`Ultra-premium apothecary cart reference. Minimal distraction-free cart design and inline delivery information are applicable to Dr Rasha's shop cart.`},{name:`Lookfantastic`,device:`Desktop`,pros:[`Cart page includes a prominently displayed free delivery threshold indicator — creates a completion incentive that increases average order value`,`Curated cross-sell recommendations in the cart are limited to two products and shown as a compact strip — creates upsell opportunity without disrupting the checkout flow`,`Trust badges (secure payment, free returns, 30-day guarantee) are displayed in the cart — addresses the three most common pre-checkout anxieties at the point of decision`],cons:[`Promotional banner across the top of the cart page creates visual competition with the cart contents — may distract from the primary completion action`,`Cross-sell products in the cart are sometimes algorithmically generated rather than curated — can surface irrelevant recommendations that undermine trust`,`Lookfantastic's promotional-heavy design approach conflicts with Dr Rasha's premium positioning — the pattern is applicable but the execution would need significant adaptation`],context:`Premium beauty retailer cart page. Delivery threshold indicator, curated cross-sell and trust badges are applicable to Dr Rasha's shop cart UX.`},{name:`Aesop`,device:`Mobile`,pros:[`Mobile cart is single-column with generous item sizing — product images are large enough to confirm the right item is in the basket without zooming`,`Quantity adjusters on mobile cart use large plus/minus buttons rather than a number input field — removes precision interaction from a critical cart management step`,`Proceed to Checkout is a full-width sticky button at the bottom of the mobile cart — the primary conversion action is always visible and thumb-reachable`],cons:[`Mobile cart does not show estimated delivery date — an increasingly expected piece of information that reduces pre-checkout abandonment`,`No saved-for-later function on mobile cart — users who are undecided about a product must either proceed with it in the cart or remove it entirely`,`Trust signal display is minimal on the mobile Aesop cart — the assurance content that appears on desktop is mostly absent on mobile`],context:`Ultra-premium apothecary mobile cart. Full-width sticky CTA and large touch target quantity adjusters are applicable to Dr Rasha's mobile cart.`},{name:`Net-a-Porter`,device:`Mobile`,pros:[`Mobile cart uses a persistent cart drawer rather than a separate cart page — users can review and edit their cart without leaving the browse context`,`Item-level delivery promise (arrives by X) is shown per line item in the mobile cart — provides specific fulfilment certainty at the individual product level`,`Mobile cart surfaces the loyalty tier impact of the order (earn X points, reach X tier) — creates an additional non-discount conversion incentive`],cons:[`Cart drawer approach is appropriate for a multi-session luxury retail browse but may not suit a focused clinic shop with a smaller product range`,`Complexity of Net-a-Porter's mobile cart (multiple fulfilment methods, loyalty, gift wrapping) reflects a different scale and product range`,`High visual weight of the Net-a-Porter mobile cart design would be disproportionate for a boutique clinic shop with fewer than 50 products`],context:`Best-in-class luxury fashion mobile cart. Per-item delivery promise and loyalty point display patterns are applicable to Dr Rasha's mobile cart experience.`}],cro:[{title:`Checkout CTA and order total always visible — no scrolling required`,detail:`The cart page has one job: convert the user to checkout. If 'Proceed to Checkout' and the order total require scrolling to find, every user who doesn't scroll is a lost conversion. A two-column layout on desktop (cart items left, order summary + CTA right) and a sticky bottom bar on mobile eliminates this barrier entirely.`},{title:`Trust strip adjacent to the checkout CTA`,detail:`'Secure checkout · Free UK delivery over £150 · Clinically formulated products' placed directly above or below the checkout button addresses the two most common last-moment hesitation triggers for premium skincare: payment security and purchase confidence. For a new or unfamiliar brand, this strip is a low-cost, high-return conversion addition.`},{title:`Free delivery progress bar`,detail:`A 'You're £X away from free UK delivery' progress bar above the cart items is one of the highest-performing average order value drivers in e-commerce. For a range where the free delivery threshold is £150 and individual products range from £65–£180, this nudge is highly relevant and naturally encourages multi-product basket building.`}]}},about:{desktop:{intro:`The About page is the clinic's credibility anchor — the place where the consultation customer decides whether to trust Dr Rasha with their face. The current page has strong photography but a structural hierarchy that buries the most persuasive content below the fold.`,working:[`Strong interior photography of the Knightsbridge clinic environment`,`Safety in Beauty Diamond Award 2025 badge present in the hero`,`Care Quality Commission registration displayed at the base of the page`,`Team section introduces Dr Rasha and two senior practitioners with credentials`],notWorking:[`No above-fold CTA — users who arrive on the About page have no immediate pathway to booking`,`Practitioner credentials (GMC registration, MBBS, years of experience) are buried deep in body copy rather than surfaced as headline trust signals`,`Duplicate content — 'The Home of Aesthetics' and 'Why Choose Dr Rasha' cover near-identical ground with no distinct purpose for each section`,`No patient outcomes, reviews, or testimonials — the page builds clinical credibility but provides no social proof from the patient perspective`,`'Enquire Today' appears three times with no hierarchy or conversion architecture around the action`],recommended:{intro:`Restructure the About page as a trust-building and conversion page — establishing practitioner credibility early, providing patient social proof, and creating a clear path to booking.`,items:[`Lead with a compact hero: Dr Rasha's portrait, name, title, GMC registration number, and a 'Book Consultation' CTA — all above the fold`,`Add a credential strip immediately below the hero: GMC Registered · MBBS · 15+ years experience · Safety in Beauty Award 2025 · CQC Registered`,`Replace duplicate content sections with a single focused 'Why Dr Rasha' section built around 3 specific differentiators with supporting evidence`,`Add a patient testimonials block with aggregate rating, review count, and 3–4 quote cards with patient first name and verified badge`,`Standardise all CTAs on the page to 'Book Consultation' — remove 'Enquire Today' variants`,`Add a treatment preview strip at the base of the page: 4–6 treatment cards linking to the treatment discovery pages`]}},mobile:{intro:`The mobile About page inherits the desktop issues with amplified impact — the constraints of single-column layout push the most persuasive content even further from the first-paint viewport.`,working:[`Brand photography translates well to mobile viewport`,`Team portrait section is readable on mobile`,`Award badge is visible on mobile`],notWorking:[`No above-fold CTA on mobile — users must scroll past the hero, brand copy, and award section before encountering any conversion pathway`,`Dense paragraph copy is not optimised for mobile reading patterns — users scan rather than read on mobile`,`Practitioner credentials require the same extensive scrolling as desktop — there is no mobile-specific adaptation of the trust signal hierarchy`,`The three 'Enquire Today' CTAs are spread throughout a long page with no sticky conversion mechanism`],recommended:{intro:`Prioritise the mobile About page around two things: establishing practitioner trust within the first scroll, and providing one clear path to booking.`,items:[`Compact hero with Dr Rasha portrait, credential summary, and 'Book Consultation' CTA visible without scrolling`,`Credential chips below the hero: GMC · MBBS · 15yrs · CQC — horizontally scrollable if needed`,`Condense 'Why Dr Rasha' to 3 bullet points with icons — no long paragraphs`,`Patient reviews: swipeable quote cards, aggregate rating visible above`,`Single sticky 'Book Consultation' bar at the base of the mobile viewport`]}},research:{intro:`Four pieces of published UX research directly supporting the About page recommendations.`,findings:[{source:`NN/G`,org:`Nielsen Norman Group`,label:`Credibility and First Impressions on the Web`,detail:`NN/g's research on web credibility found that users assess professional competence within seconds of landing on a page, and that for service businesses, visible professional credentials are among the strongest trust signals available. The Dr Rasha About page contains the right credibility material but positions it below the fold — placing it outside the zone where 57% of viewing time is concentrated.`,url:`https://www.nngroup.com/articles/prominence-interpretation-theory/`},{source:`Baymard`,org:`Baymard Institute`,label:`Homepage UX — Social Proof and Brand Storytelling`,detail:`Baymard's usability testing found that users evaluate brand trustworthiness rapidly on arrival, and for high-consideration services, patient testimonials and social proof are among the most influential decision factors. The current About page has no patient voice — only the clinic's own claims about itself — which limits its persuasive impact for first-time consultation customers.`,url:`https://baymard.com/blog/ecommerce-homepage-ux`},{source:`NN/G`,org:`Nielsen Norman Group`,label:`Consistency and Standards (Heuristic #4)`,detail:`Three instances of 'Enquire Today' on the About page — all triggering the same action — with no visual hierarchy between them violates the consistency principle. Users are left uncertain whether these are the same action and whether they are more or less committed by clicking one vs another. A single standardised 'Book Consultation' CTA with one prominent and two secondary instances creates clarity without reducing conversion opportunity.`,url:`https://www.nngroup.com/articles/consistency-and-standards/`},{source:`NN/G`,org:`Nielsen Norman Group`,label:`Scrolling and Attention — Above-the-Fold Priority`,detail:`57% of user attention is focused above the fold. The About page — the page most likely to be visited by a consultation customer who is actively evaluating whether to enquire — has no CTA and no practitioner credentials in this zone. The most persuasive and conversion-driving content on the entire page is positioned below the median drop-off threshold.`,url:`https://www.nngroup.com/articles/scrolling-and-attention/`}]},competitors:[{name:`Dr Yannis Alexandrides (111 Harley St)`,device:`Desktop`,pros:[`About page leads with the founder's medical credentials, publication record and clinical training — establishes scientific authority before personal narrative`,`Patient results and testimonials specific to the founder's treatments appear within the about page — connects practitioner credibility directly to patient outcomes`,`The about page doubles as a trust hub — press coverage, awards and professional memberships are consolidated in a single credibility section`],cons:[`Dense biographical copy makes it difficult to extract key trust signals quickly — users who scan rather than read may miss the most persuasive credentials`,`No clear CTA on the about page — users persuaded by the founder's credentials have no obvious next action`,`Photography is high quality but static — video content showing the founder in a clinical environment would increase perceived expertise`],context:`Senior Harley Street aesthetic doctor with a strong personal brand. Reference for medical credentials-first about page structure for a founder-led clinic.`},{name:`Bamford`,device:`Desktop`,pros:[`About page leads with a founding story narrative — creates emotional investment before any service information is presented`,`Scientific credibility and personal story are balanced — neither overwhelms the other, creating a compelling dual trust signal`,`Brand values are expressed as concrete commitments (ingredients, sourcing, environment) rather than aspirational statements — more credible and specific`],cons:[`Heritage-first approach is appropriate for a long-established brand but harder to execute for a newer clinic without a lengthy founding story to draw on`,`Very low information density means users with specific questions (who is the founder, what are the qualifications) must work hard to find answers`,`Booking and consultation CTAs are absent from the Bamford about page — conversion is entirely passive, relying on users navigating elsewhere`],context:`Premium British wellness brand with heritage positioning. Reference for founder story + values structure applicable to Dr Rasha's about page.`},{name:`Dr Yannis Alexandrides (111 Harley St)`,device:`Mobile`,pros:[`Mobile about page leads with a single portrait and three credential lines — communicates authority in the first screen without any scroll`,`Press coverage logos shown as a horizontal scrollable strip on mobile — communicates credibility without vertical space overhead`,`Book a Consultation CTA appears after the credentials section on mobile — placed at the natural point of persuasion`],cons:[`Biographical detail is truncated on mobile — the condensed format loses context that makes the desktop story compelling`,`Patient testimonials collapsed behind Show more on mobile — most users will not expand, reducing social proof impact`,`No navigation to specific treatments from the mobile about page`],context:`Senior Harley Street practitioner mobile reference. Credentials-first mobile layout applicable to Dr Rasha.`},{name:`La Mer`,device:`Mobile`,pros:[`Mobile about page leads with the founding story in a single elegant sentence — creates brand mythology at first glance without requiring reading`,`Product discovery is embedded in the mobile about page — brand story and product consideration are unified rather than separated`,`Scroll-triggered reveal animations on mobile create a premium feel without impacting load time — simple CSS transitions rather than JavaScript-heavy effects`],cons:[`La Mer's century-old founding story is not transferable to a newer clinic brand — the narrative structure needs adaptation`,`Product-embedding assumes purchase intent from the about page visit — not applicable to a consultation-led clinic`,`Animation-heavy mobile about page may cause issues for users with prefers-reduced-motion settings or low-end devices`],context:`Ultra-luxury skincare brand mobile about page. Founding story economy and scroll-reveal patterns applicable to Dr Rasha's mobile about page.`}],cro:[{title:`Practitioner credentials above the fold`,detail:`Surface Dr Rasha's GMC registration number, MBBS, and years of experience in the first viewport. For high-consideration medical services, practitioner credibility is the primary conversion driver on the About page — it should be the first thing a user sees, not something they discover after scrolling through photography and brand copy.`},{title:`Patient social proof before the booking CTA`,detail:`Add 3–4 patient testimonials with aggregate Trustpilot rating and 'X verified reviews' immediately above the primary booking CTA. Social proof from the patient perspective directly addresses the consultation customer's primary anxiety — 'will I still look like myself?' — and converts abstract clinical credibility into a concrete, relatable outcome.`},{title:`Consultation CTA with reassurance micro-copy`,detail:`Add 'Book a Consultation' with supporting micro-copy — 'Complimentary · No obligation · Knightsbridge, London' — at the mid-point of the page and as the closing section. Removes the two biggest psychological barriers to making first contact with a medical aesthetics clinic at the exact moment users have consumed enough trust content to be persuadable.`}]},plim:{desktop:{intro:`The PLIM Finance page is a conversion-critical but underperforming page. Finance options are a significant purchase driver for high-value aesthetic treatments — patients who understand their payment options convert at substantially higher rates. The current page provides comprehensive information but the structure prioritises explanation over conversion.`,working:[`PLIM Finance information is detailed and covers all plan options (PLIM 1, PLIM 3, PLIM 8) with specific terms`,`Step-by-step application process is clearly numbered and explained`,`Contact information for PLIM queries is provided`,`DRC team involvement in the application is explained`],notWorking:[`No above-fold CTA — the page has no 'Apply Now' or 'Check My Eligibility' button visible without scrolling`,`No treatment-specific finance examples — users cannot immediately see what their desired treatment would cost across PLIM 1, PLIM 3, and PLIM 8 without calculating manually from the percentages`,`The plan options section leads with 'PLIM 1' (50% upfront — the most demanding plan) rather than surfacing the most accessible plan first`,`No eligibility quick-check — the four eligibility criteria are listed but there's no interactive element that helps users self-qualify before reading the full application process`,`The mailing list CTA and navigation footer appear mid-page, breaking the user's reading flow before the application process section`],recommended:{intro:`Restructure the PLIM Finance page to lead with accessibility and confidence, and create a clear path from eligibility to application.`,items:[`Hero section: 'Finance your treatment' headline, 3 key benefit bullets (spread cost, no large upfront payment, DRC support throughout), and a 'Check My Eligibility' CTA — all above the fold`,`Treatment finance calculator: user selects treatment from a dropdown, chooses plan (PLIM 1/3/8), and sees the calculated monthly and upfront costs — removes manual calculation friction`,`Reorder plan options: PLIM 8 first (lowest upfront, most accessible), PLIM 3 second, PLIM 1 last`,`Eligibility quick-check: 4 checkbox items — UK citizen? · 1+ year address history? · Monthly payments 3–8 months? · Treatment eligible? — with a 'You may be eligible' confirmation message`,`Remove the mailing list section and navigation footer from mid-page — keep the reading flow uninterrupted from intro to application process`,`Closing section: 'Ready to apply?' with 'Contact the DRC team' CTA, WhatsApp number as a tappable link, and the PLIM portal URL`]}},mobile:{intro:`The mobile PLIM Finance page has the same structural issues as desktop, amplified by the single-column layout. The most persuasive content — payment plan options and application steps — requires extensive scrolling to reach.`,working:[`Plan terms and application steps are legible on mobile`,`Contact information is present and functional`],notWorking:[`No above-fold CTA on mobile — users land on text-heavy content with no immediate action available`,`Plan comparison requires significant vertical scrolling — users cannot see multiple plans side by side to compare`,`Manual percentage calculations are particularly cumbersome on mobile`,`The mailing list section breaks the reading flow even earlier on mobile due to the single-column layout`],recommended:{intro:`Optimise the mobile PLIM Finance page for fast eligibility assessment and contact initiation.`,items:[`Above-fold hero: 'Finance your treatment' headline, 3 benefit bullets, 'Check eligibility' CTA`,`Plan cards: vertically stacked, each with plan name, upfront %, monthly %, minimum/maximum transaction, and a condensed terms note`,`Eligibility checklist: 4 large tap-friendly checkbox items`,`Application steps: numbered accordion — users can expand each step individually`,`Closing CTA: 'WhatsApp the DRC team' as a full-width green button, followed by portal link`]}},research:{intro:`Four pieces of published UX research supporting the PLIM Finance page recommendations.`,findings:[{source:`Baymard`,org:`Baymard Institute`,label:`Checkout UX — Payment Options and Financing`,detail:`Baymard's research found that when payment options and financing are not surfaced clearly early in the consideration journey, a significant proportion of high-intent users self-select out before reaching the checkout stage — not because they can't afford the product, but because they couldn't identify a suitable payment pathway. For high-value aesthetic treatments, surfacing finance options prominently reduces pre-enquiry abandonment.`,url:`https://baymard.com/blog/cart-abandonment-rate`},{source:`NN/G`,org:`Nielsen Norman Group`,label:`Scrolling and Attention — Content Prioritisation`,detail:`57% of viewing time is concentrated above the fold. The PLIM Finance page has no CTA and no 'quick start' element in this zone — only a header and introductory text. The most action-relevant content (plan options, eligibility criteria, application steps) is positioned well below the median drop-off point.`,url:`https://www.nngroup.com/articles/scrolling-and-attention/`},{source:`NN/G`,org:`Nielsen Norman Group`,label:`Reducing Cognitive Load in Form and Process UX`,detail:`NN/g's research on form and process UX found that when users are asked to calculate or manually process numerical information (such as applying percentages to treatment costs), error rates increase and abandonment rises. A built-in treatment finance calculator that does the arithmetic for the user removes a significant friction point at a high-intent decision moment.`,url:`https://www.nngroup.com/articles/minimize-cognitive-load/`},{source:`Baymard`,org:`Baymard Institute`,label:`Product Page UX — Financing and Affordability Signals`,detail:`Baymard's usability testing found that showing monthly payment estimates on product and service pages — rather than requiring users to navigate to a separate finance page — significantly increases willingness to proceed for high-value items. For Dr Rasha, surfacing 'from £X/month with PLIM Finance' on individual treatment pages and linking to the finance page creates a more effective finance-to-conversion funnel than the current isolated finance page.`,url:`https://baymard.com/blog/ecommerce-product-page-design`}]},competitors:[{name:`Harley Street Skin Clinic`,device:`Desktop`,pros:[`Finance page is structured as a decision guide rather than a product page — it explains the process (apply, get approved, book) before presenting the finance options`,`Representative APR and example monthly costs are displayed prominently — addresses the highest-friction question (what will I actually pay?) before the user has to ask`,`Third-party finance provider credentials (FCA regulation, FSCS protection) are foregrounded — builds regulatory trust critical for medical finance decisions`],cons:[`Finance page copy assumes familiarity with credit products — users who are new to medical finance may not understand the terminology without additional explanation`,`No comparison of finance vs paying outright — users who could afford to pay in full may not understand the benefit of spreading payments`,`Call to action is to apply for finance rather than to book — creates a two-step process (finance then booking) that extends the conversion journey unnecessarily`],context:`Established Harley Street clinic with a visible finance offering. Direct reference for regulated finance page structure on a premium medical aesthetics site.`},{name:`Nuffield Health`,device:`Desktop`,pros:[`Finance options page clearly separates self-pay, insurance and payment plan pathways — users self-select their appropriate route rather than wading through irrelevant information`,`Monthly cost calculators are embedded inline — users can model their actual payment before committing to an enquiry, significantly increasing enquiry quality`,`Trust signal hierarchy (CQC regulated, NHS partners, GMC registered consultants) is prominent throughout the finance page — regulatory credibility is maintained at the financial decision point`],cons:[`Nuffield's NHS partnership creates a different trust context from a private medical aesthetics clinic — the regulatory credibility signals need adaptation`,`Payment plan options reflect Nuffield's hospital-scale procedures — not all structures are applicable to aesthetic treatment packages of lower overall value`,`Finance page is deeply integrated with Nuffield's patient portal — the backend infrastructure required is not proportionate for a boutique clinic`],context:`Best-in-class private healthcare payment options page. Self-select pathway structure and inline cost calculator are applicable to Dr Rasha's PLIM finance page.`},{name:`Harley Street Skin Clinic`,device:`Mobile`,pros:[`Mobile finance page reduces to a three-step process visual (apply, approve, book) — communicates the journey in a single screen without overwhelming detail`,`APR and example monthly cost are displayed as a prominent stat strip on mobile — the financial headline information survives the mobile format without being buried`,`Click-to-call CTA is primary on the mobile finance page — reflects that finance decisions on mobile are more likely to result in a call than an online application`],cons:[`Process simplification on mobile loses some of the reassurance detail that converts undecided users — the condensed format trades information for clarity`,`Finance application form is not mobile-optimised — users who want to apply on mobile face a desktop-formatted form on a small screen`,`No chat or callback option on the mobile finance page — users with questions about the finance terms have limited support options`],context:`Harley Street clinic mobile finance page reference. Three-step mobile journey and click-to-call primary CTA are applicable to Dr Rasha's mobile PLIM page.`},{name:`Klarna`,device:`Mobile`,pros:[`Mobile landing page communicates the finance proposition in a single screen — headline, benefit, and CTA visible without any scroll`,`Social proof (number of users, partner merchants) is used as a primary trust signal on mobile — normalises the finance product through scale rather than regulatory language`,`The how it works section uses a three-frame animation on mobile — explains the process visually without requiring reading, appropriate for the mobile context`],cons:[`Klarna's BNPL positioning is very different from a regulated medical finance product — the tone and credibility signals need significant adaptation`,`Klarna's brand familiarity does much of the trust-building work — a lesser-known finance partner would need more explicit regulatory reassurance`,`Consumer finance UX optimised for impulse purchase — not directly applicable to a considered medical treatment decision where the financial commitment is higher`],context:`Best-in-class consumer finance mobile UX. Single-screen proposition and animated how-it-works patterns are applicable to Dr Rasha's mobile PLIM finance page.`}],cro:[{title:`Treatment finance calculator above the fold`,detail:`A dropdown where users select their treatment, choose a plan, and see the calculated monthly and upfront costs is the single highest-impact addition to this page. Removing the mental arithmetic from finance consideration is a direct conversion lever — users who can see a concrete monthly figure are significantly more likely to proceed with an application or enquiry than users who must calculate it themselves.`},{title:`Reorder plans from most accessible to least`,detail:`PLIM 8 (25% upfront, 75% over 8 months) should be the first plan shown, not the last. Leading with the most accessible plan (lowest upfront commitment) reduces the cognitive barrier to finance consideration. Users who can self-qualify against the most favourable terms first are more likely to continue reading — those who can't qualify for the most favourable plan can then scroll to PLIM 3 or PLIM 1.`},{title:`Surface PLIM Finance on individual treatment pages`,detail:`Add 'from £X/month with PLIM Finance' as a secondary information line adjacent to the treatment price on every treatment page. Finance accessibility is a consideration that happens at the treatment research stage, not only on the dedicated finance page — users who see financing options at the point of price consideration are more likely to proceed to enquiry than users who must navigate to the finance page to understand their options.`}]},roomRentals:{desktop:{intro:`The Room Rentals page serves a B2B audience — medical professionals seeking a clinical room in a premium Knightsbridge setting. This audience has different decision criteria to the consultation customer and the page should be structured to address their professional needs efficiently.`,working:[`Clear headline — 'Looking for a professional space to grow your practice?' — immediately establishes relevance for the target audience`,`High-quality photography of the clinic interior communicates the premium environment effectively`,`Contact form provides a direct enquiry pathway`],notWorking:[`No above-fold CTA — the page opens with photography and introductory copy, with the contact form below the fold on most viewport sizes`,`No pricing information or indicative rates — medical professionals need to understand cost before investing time in an enquiry`,`No list of included amenities or facilities — practitioners making rental decisions need specific information: reception support, equipment availability, sterilisation facilities, booking system integration`,`The 'SEND' button on the contact form provides no reassurance copy — no expected response time, no indication of what happens after submission`,`Form fields (First Name, Last Name, Email, Message) are generic — no field for rental duration, practice type, or specific requirements — increasing the number of back-and-forth enquiry exchanges needed to progress a booking`],recommended:{intro:`Restructure the Room Rentals page to efficiently address the B2B practitioner's decision criteria and create a faster path from enquiry to confirmed rental.`,items:[`Above-fold hero: headline, 3 key facility benefits (prime Knightsbridge location, fully equipped rooms, flexible booking), and a 'Check Availability' or 'Enquire Now' CTA`,`Facilities section: bulleted list of specific room amenities — consultation couch, clinical lighting, sterilisation access, CQC-registered premises, reception support`,`Pricing and terms: 'Rental rates from £X/day or £X/session — contact us for current availability and rates'. Even indicative pricing reduces barrier to enquiry`,`Enhanced enquiry form: add 'Practice type' dropdown (aesthetics, dermatology, GP, therapist), 'Preferred days/sessions', and 'Treatment type' to reduce back-and-forth`,`Below the form: 'We typically respond within 24 hours' and 'View our CQC registration' link — adds process clarity and professional credibility`,`Footer: link to the main clinic page and About page — practitioners will want to verify the clinic's standing before committing to a room rental`]}},mobile:{intro:`The mobile Room Rentals page serves the same B2B audience in a mobile context — practitioners who may be browsing between sessions or researching on the go. The same structural issues apply with amplified impact on a single-column layout.`,working:[`Photography presents well on mobile viewport`,`Form fields are usable on touch`],notWorking:[`No above-fold CTA on mobile — users must scroll past hero imagery, heading, and full introductory paragraph before reaching any action`,`Contact form on mobile requires scrolling past all page content before the user can begin filling it in`,`Generic form fields on mobile increase typing effort — practitioners on mobile are less likely to complete a form that requires extensive free-text in a single Message field`,`No pricing indication on mobile — the barrier to enquiry is higher on mobile where users make faster, lower-commitment decisions`],recommended:{intro:`Optimise mobile Room Rentals for fast initial contact — reduce the form complexity and surface the key decision information earlier.`,items:[`Above-fold: headline, 3 bullet facility highlights, 'Enquire About Availability' CTA button`,`Pricing line: 'Day/session rates available on request — contact us for current availability'`,`Facilities list: vertically stacked icon + text rows (clean and scannable on mobile)`,`Simplified mobile form: Name (single field), Email, Practice Type (dropdown), Preferred Schedule (dropdown), and a short Optional Notes field`,`'We respond within 24 hours' note directly below the Submit button`,`WhatsApp alternative: 'Prefer to talk? WhatsApp us directly' as a secondary contact option`]}},research:{intro:`Four pieces of published UX research supporting the Room Rentals page recommendations.`,findings:[{source:`NN/G`,org:`Nielsen Norman Group`,label:`Form Design Best Practices — Reducing Friction`,detail:`NN/g's research on form UX found that forms with clearly purposeful fields (fields that obviously serve the user's goal) are completed at significantly higher rates than generic contact forms. A 'First Name, Last Name, Email, Message' form for a B2B room rental enquiry places the full burden of qualifying information on the user — a structured form with dropdown fields for practice type and preferred schedule reduces cognitive effort and increases completion rates.`,url:`https://www.nngroup.com/articles/web-form-design/`},{source:`Baymard`,org:`Baymard Institute`,label:`Product Page UX — Pricing Transparency`,detail:`Baymard's research consistently identifies the absence of pricing information as a significant cause of high-intent abandonment. For B2B services where exact pricing varies, 'from £X' or 'rates available on request' language is significantly more effective than no pricing information — it reduces the uncertainty that prevents professionals from enquiring, while leaving room for customised pricing conversations.`,url:`https://baymard.com/blog/ecommerce-product-page-design`},{source:`NN/G`,org:`Nielsen Norman Group`,label:`Scrolling and Attention — CTA Visibility`,detail:`57% of viewing time is concentrated above the fold. The Room Rentals page has no CTA in this zone — only a decorative icon, introductory prose, and an embedded image. The contact form and enquiry pathway require significant scrolling to reach, meaning the majority of visiting practitioners encounter the page's primary conversion action below their natural attention threshold.`,url:`https://www.nngroup.com/articles/scrolling-and-attention/`},{source:`NN/G`,org:`Nielsen Norman Group`,label:`B2B UX — Decision Criteria and Information Architecture`,detail:`NN/g's B2B website research found that professional decision-makers require specific, concrete information — facilities, terms, availability, pricing context — before they are willing to invest time in an enquiry. When this information requires contacting the vendor to obtain, a significant proportion of qualified prospects self-select out rather than initiate the enquiry. Surfacing even indicative information reduces this pre-enquiry abandonment.`,url:`https://www.nngroup.com/articles/b2b-ux-research/`}]},competitors:[{name:`WeWork`,device:`Desktop`,pros:[`Space listings page uses a map-and-list split view — users can browse by location and property attributes simultaneously, reducing the sequential navigation required`,`Pricing is displayed as a transparent per-desk or per-room daily rate — removes the request-for-quote friction that deters small business enquiries`,`Virtual tour integration on space listing pages removes the need for a site visit as a pre-condition of enquiry — significantly reduces friction for remote prospective renters`],cons:[`WeWork's hot-desking and open-plan model creates a different product category from a private medical treatment room — the pricing and booking structure needs adaptation`,`Scale of WeWork's offering (hundreds of locations) creates a discovery problem that a single-location clinic room rental would not face`,`Membership model assumptions in WeWork's UX conflict with the per-day or per-week room rental model typical of clinic room rentals`],context:`Best-in-class B2B space rental UX. Map-and-list layout, transparent pricing and virtual tour integration are all applicable to Dr Rasha's room rentals page.`},{name:`Situ Live`,device:`Desktop`,pros:[`Room configuration and specification detail (dimensions, equipment, facilities) is shown as a scannable spec table — answers the highest-frequency B2B questions without a lengthy call`,`Availability calendar is embedded on the listing page — prospective renters can assess fit immediately without waiting for a human response`,`Social proof from existing renters (business type, use case, tenure) is shown alongside the room listing — normalises the concept of renting within the target audience`],cons:[`Situ Live's technology showroom model creates a different context from a medical treatment room rental — not all facility descriptions or use cases are transferable`,`Availability calendar assumes a self-serve booking model that may not be appropriate for a clinic managing its own schedule around Dr Rasha's practice`,`Business tenant profiles on Situ Live reflect a different renter persona from practitioners looking for a consulting room in a medical aesthetics environment`],context:`Premium B2B space rental with embedded availability and spec detail. Calendar availability and renter social proof patterns are applicable to Dr Rasha's room rentals page.`},{name:`WeWork`,device:`Mobile`,pros:[`Mobile space listings use a card-based scroll with a toggle to map view — maintains discoverability on mobile without forcing a choice between browsing modes`,`Enquire Now CTA is persistent at the bottom of the mobile room listing — the primary conversion action is always reachable regardless of scroll depth`,`Space attributes (capacity, AV equipment, natural light) are shown as scannable icon-and-label pairs on mobile — reduces reading effort for comparative browsing`],cons:[`WeWork's mobile UX is optimised for workers looking for daily drop-in space — the booking journey is faster than appropriate for a longer-term room rental decision`,`Location search is the primary mobile entry point — less applicable to a clinic where the location is fixed and the decision is about suitability not geography`,`Mobile notification and account features reflect a subscription product model that doesn't transfer to a room rental enquiry flow`],context:`Best-in-class B2B space rental mobile UX. Card-with-map-toggle and persistent enquiry CTA are applicable to Dr Rasha's mobile room rentals experience.`},{name:`Trouva`,device:`Mobile`,pros:[`Mobile brand/space pages use a story-led approach — the environment, values and community are communicated before specifications, creating aspiration before evaluation`,`Contact and availability are accessed via a single prominent button that opens a chat — reduces the perceived effort of making an initial enquiry`,`Featured renter profiles on mobile communicate the calibre of existing occupants — a social proof mechanism that is particularly effective for B2B decisions`],cons:[`Trouva's independent retail context is different from a medical treatment room rental — the community-led positioning needs adaptation for a clinical environment`,`Chat-first contact model may not be appropriate for a clinic that needs to qualify renters against specific medical practice requirements`,`Aspirational positioning works for Trouva's creative business tenant — a medical practitioner renting a treatment room has more functional evaluation criteria`],context:`Best-in-class independent B2B space mobile UX. Story-led approach and chat-first contact are applicable to Dr Rasha's mobile room rentals page.`}],cro:[{title:`Facilities list above the enquiry form`,detail:`A concise, scannable list of room facilities (CQC-registered premises, consultation couch, clinical lighting, sterilisation access, reception support) above the contact form addresses the B2B practitioner's primary decision criteria before they invest time in an enquiry. Practitioners who can see the specific facilities available are more qualified leads and more likely to convert from enquiry to booking than those who must ask for this information through the form.`},{title:`Indicative pricing to reduce pre-enquiry abandonment`,detail:`'Day and session rates from £X — contact us for current availability and pricing' removes the uncertainty that causes qualified practitioners to abandon before enquiring. For a B2B audience making a considered professional decision, the absence of any pricing context is a stronger barrier to enquiry than a price that seems slightly high — at least a visible number gives them a basis for a conversation.`},{title:`Practice type dropdown in the enquiry form`,detail:`Adding a 'Practice type' dropdown (aesthetics, dermatology, GP, cosmetic therapist, other) to the enquiry form enables the clinic to prioritise and route enquiries efficiently, and signals to prospective practitioners that the clinic has experience working with their specific practice type — a subtle but meaningful credibility signal for a B2B audience evaluating whether this is the right environment for their patients.`}]}},ye=(0,h.createContext)({isEditing:!1,edits:{},saveEdit:()=>{}}),be=()=>(0,h.useContext)(ye),xe=e((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),k=e(((e,t)=>{t.exports=xe()}))();function Se({editKey:e,defaultValue:t,style:n={},multiline:r=!1}){let{isEditing:i,edits:a,saveEdit:o}=be(),s=e in a?a[e]:t;return i?r?(0,k.jsx)(`textarea`,{value:s,onChange:t=>o(e,t.target.value),rows:3,style:{width:`100%`
